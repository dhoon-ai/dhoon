<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dhoon">
  <!-- Dhoon logo (original artwork, MIT): the inner spark, a flame with a bright core and rising sparks. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#0f0a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="190" fill="url(#glow)"/>
  <path d="M 256 112 C 314 194 365 245 350 338 C 338 409 295 440 256 440 C 217 440 174 409 162 338 C 151 268 209 237 221 175 C 236 210 256 218 264 194 C 272 167 260 140 256 112 Z" fill="url(#flame)"/>
  <path d="M 256 245 C 287 284 311 315 303 358 C 297 393 279 412 256 412 C 233 412 215 393 209 358 C 203 323 236 303 248 268 C 252 288 264 288 256 245 Z" fill="#fde68a"/>
  <circle cx="256" cy="377" r="22" fill="#fffbeb"/>
  <!-- rising sparks -->
  <circle cx="368" cy="128" r="14" fill="#fbbf24"/>
  <circle cx="404" cy="84" r="9" fill="#fde68a"/>
  <circle cx="150" cy="150" r="8" fill="#fbbf24"/>
</svg>
