# LibreChat configuration - connects the chat UI to your local model and tools.
version: 1.3.17
cache: true

# Dhoon branding (the name, footer and icons are set in docker-compose.override.yml)
interface:
  customWelcome: "Welcome to Dhoon, {{user.name}}. What shall we get done today?"

endpoints:
  # An agent run stops after this many steps (each tool call uses about 2). The default 25
  # is too few for a planned task with research, stock data and a report.
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
  custom:
    - name: "Ollama"                 # name must start with "ollama" so models are listed automatically
      apiKey: "ollama"
      # Through the toolbox, which passes everything to Ollama unchanged and keeps a copy of
      # the Assistant's instructions so they can be read in advance (fast first answer).
      baseURL: "http://host.docker.internal:8001/ollama/v1/"
      models:
        default: ["__MODEL_MAIN__", "__MODEL_FAST__"]   # filled in by the install script
        fetch: true
      titleConvo: true
      titleModel: "__MODEL_FAST__"         # small fast model writes chat titles
      modelDisplayLabel: "Local AI"

# Files attached with + / the paperclip: never send them straight to the model.
# Ollama rejects files inside messages ("400 invalid message format") and a whole book
# would not fit anyway. With "none", an attachment goes to the agent's File Search
# (local search with nomic-embed-text), so turn on File Search for the agent.
fileConfig:
  defaultLLMDeliveryPath:
    fallback: "none"
    overrides:
      "application/pdf": "none"
      "image/*": "none"
      "audio/*": "none"
      "video/*": "none"

# LibreChat blocks internal addresses by default (SSRF protection).
# Allow ONLY our toolbox port on the host.
mcpSettings:
  allowedAddresses:
    - "host.docker.internal:8001"

mcpServers:
  toolbox:
    type: streamable-http
    url: "http://host.docker.internal:8001/mcp"
    timeout: 600000                  # 10 min: CPU-only machines are slow; big tasks can take minutes
