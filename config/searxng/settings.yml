# SearXNG = your private search engine. It asks Google/Bing/DuckDuckGo etc. for you.
use_default_settings: true

server:
  # replaced with a random value by scripts/03_searxng.sh
  secret_key: "CHANGE_ME"
  limiter: false          # only you use it, so no rate limiter needed
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json                # the agent needs JSON results

# Make sure the free, account-free engines listed in the guide can be chosen
# (e.g. RESEARCH_ENGINES="startpage,duckduckgo,brave" in config/models.env).
engines:
  - name: startpage
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false
