<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Inglenook">
  <!-- Inglenook logo (original artwork, MIT): a fireplace nook with a warm flame. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2c1a"/>
      <stop offset="1" stop-color="#1c120c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- mantel shelf -->
  <rect x="88" y="104" width="336" height="34" rx="12" fill="#f3e3c8"/>
  <!-- stone surround with the arched opening -->
  <path d="M112 138 H400 V424 H332 V286 A76 76 0 0 0 180 286 V424 H112 Z" fill="#e8d2ad"/>
  <!-- the opening -->
  <path d="M180 424 V286 A76 76 0 0 1 332 286 V424 Z" fill="#140c08"/>
  <ellipse cx="256" cy="372" rx="92" ry="70" fill="url(#glow)"/>
  <!-- flame -->
  <path d="M256 236 C286 278 312 304 304 352 C298 388 276 404 256 404 C236 404 214 388 208 352 C202 316 232 300 238 268 C246 286 256 290 260 278 C264 264 258 250 256 236 Z" fill="url(#flame)"/>
  <path d="M256 304 C272 324 284 340 280 362 C277 380 268 390 256 390 C244 390 235 380 232 362 C229 344 246 334 252 316 C254 326 260 326 256 304 Z" fill="#fde68a"/>
  <!-- hearth stone -->
  <rect x="96" y="424" width="320" height="26" rx="10" fill="#f3e3c8"/>
</svg>
